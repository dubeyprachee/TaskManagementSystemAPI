server:
  port: 8055
  servlet:
    context-path: /tms

tms:
  security:
    jwt: false

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tmsdb?useSSL=false&autoReconnect=true&noAccessToProcedureBodies=true&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
